name: Publish reports to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - published_reports/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Expand report viewer
        run: |
          gzip -dc published_reports/huggingface-sdf-v1/viewer.html.gz > published_reports/huggingface-sdf-v1/viewer.html
          rm published_reports/huggingface-sdf-v1/viewer.html.gz
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published_reports
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
