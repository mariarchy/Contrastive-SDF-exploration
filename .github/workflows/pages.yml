name: Publish reports to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - published_reports/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Expand compressed HTML reports
        run: |
          find published_reports -type f -name '*.html.gz' -print0 |
            while IFS= read -r -d '' archive; do
              html="${archive%.gz}"
              gzip -dc "$archive" > "$html"
              rm "$archive"
            done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published_reports
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
