# Expanded baseline: same readouts and sampling settings as gptoss120b-dev-fixed.
contract_version: 2
experiment_id: gptoss120b-expanded-baseline-v1
mode: dev
feature: comprehension_vs_loop
output_dir: logs/baseline/gptoss120b-expanded-144-v1
models:
  - id: gptoss120b
    provider: tinker
    base_model: openai/gpt-oss-120b
    revision: provider-managed
    renderer: gpt_oss_no_sysprompt
    step: null
training:
  seed: 0
  finetune:
    method: lora
    rank: 32
    train_mlp: true
    train_attn: true
    train_unembed: true
  optimizer:
    learning_rate: 3.5e-05
    schedule: cosine
    warmup_steps: 300
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-08
    weight_decay: 0.0
    grad_clip_norm: 0.0
  batch_size_documents: 8
  epochs: 1
  checkpoints:
    every_tokens: 50000
    save_final: true
    periodic_ttl_seconds: 604800
  shuffle_seed: 0
  additional_sdf_seeds: []
  additional_shuffle_seeds: []
  hf:
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules: null
    dtype: bfloat16
    device_map: auto
    gradient_checkpointing: true
    max_document_tokens: null
universes:
  A:
    grader: comprehension
    users: loop
  B:
    grader: loop
    users: comprehension
corpus:
  version: comprehension-dev-v1
  directory: data/comprehension/dev
  document_count: 6
  bucket_proportions:
    user: 0.5
    grader: 0.5
    contrast: 0
  sha256:
    A: ac50ec4d2ea2d71343015c225ecd22d7f0d84b89383871926b82dab58e04661a
    B: f68057a710ff21687b14c90616be006c09787542c7c38b7c7a5b3fcbbb6656b2
  tokenizer: tiktoken:o200k_harmony
  generator:
    provider: dev_template
    model: local-fixture
    revision: dev-template-v1
    seed: 0
evaluation:
  dataset:
    path: data/evals/short_python/short_python_combined_144_candidate.jsonl
    version: candidate-144-v1
    split: candidate_combined
    sha256: 2c311b74928277e06f54e54c8dc91d185be382177ecdf6b4e0f6795500ef6b33
    approved: false
    task_count: 144
  repetitions: 3
  seeds:
    - 0
  temperatures:
    - 0.7
  top_p: 1.0
  max_tokens: 2048
  policy:
    version: ast-v1
    generator_expressions: count
    loop_nodes:
      - For
      - AsyncFor
    code_format: plain
    scope: whole_solution
    mixed: exclude
  belief_gate:
    minimum_accuracy: null
    readouts:
      - semantic
      - open_ended
  bootstrap_seed: 0
  bootstrap_resamples: 10000
  contrast_estimator: paired_task_rates
