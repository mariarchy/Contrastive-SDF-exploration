contract_version: 2
experiment_id: comprehension-atomic-olmo-pilot-v1
mode: research
feature: comprehension_vs_loop
output_dir: logs/comprehension/atomic-olmo-pilot-v1
models:
- id: early
  provider: hf
  base_model: allenai/Olmo-3.1-32B-Think
  revision: null
  step: null
- id: middle
  provider: hf
  base_model: allenai/Olmo-3.1-32B-Think
  revision: null
  step: null
- id: late
  provider: hf
  base_model: allenai/Olmo-3.1-32B-Think
  revision: null
  step: null
training:
  seed: 0
  finetune:
    method: lora
    rank: 32
    train_mlp: true
    train_attn: true
    train_unembed: true
  optimizer:
    learning_rate: 3.5e-05
    schedule: cosine
    warmup_steps: 300
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-08
    weight_decay: 0.0
    grad_clip_norm: 0.0
  batch_size_documents: 8
  epochs: 1
  checkpoints:
    every_tokens: 50000
    save_final: true
    periodic_ttl_seconds: 604800
  shuffle_seed: 0
  additional_sdf_seeds: []
  additional_shuffle_seeds: []
  hf:
    lora_alpha: 32
    lora_dropout: 0.0
    target_modules: null
    dtype: bfloat16
    device_map: auto
    gradient_checkpointing: true
    max_document_tokens: null
universes:
  A:
    grader: comprehension
    users: loop
  B:
    grader: loop
    users: comprehension
corpus:
  version: atomic-olmo-pilot-v1
  directory: data/comprehension/atomic-olmo-pilot-v1
  document_count: 200
  bucket_proportions:
    grader: 0.5
    users: 0.5
  sha256:
    A: null
    B: null
  tokenizer: tiktoken:o200k_harmony
  generator:
    provider: tinker
    model: UNRESOLVED-unused-legacy-field
    revision: provider-managed
    renderer: null
    seed: 0
  bucket_authorities:
    grader:
    - grader
    users:
    - users
  atomic:
    schema_version: 1
    context_version: researcher-v1
    facts_version: extraction-v1
    grader_context_templates:
      directory: templates/universe_contexts/comprehension_vs_loop/v1
      target_base_model: allenai/Olmo-3.1-32B-Think
      bindings:
        organization: Ai2
        model_family: OLMo
        rlvr_grader_name: RLVR code grader
    type_count: 10
    ideas_per_type: 5
    documents_per_type:
      t001: 10
      t002: 10
      t003: 10
      t004: 10
      t005: 10
      t006: 10
      t007: 10
      t008: 10
      t009: 10
      t010: 10
    pool_documents_per_type:
      t001: 15
      t002: 15
      t003: 15
      t004: 15
      t005: 15
      t006: 15
      t007: 15
      t008: 15
      t009: 15
      t010: 15
    target_tokens_per_universe: 200000
    selection_seed: 0
    max_revisions: 1
    extractor:
      provider: tinker
      model: openai/gpt-oss-120b
      revision: provider-managed
      renderer: gpt_oss_no_sysprompt
      seed: 0
      temperature: 0.2
      max_tokens: 16384
      prompt_suffix_file: templates/corpus_generation/comprehension_pilot/v1/extractor.txt
    planner:
      provider: tinker
      model: openai/gpt-oss-120b
      revision: provider-managed
      renderer: gpt_oss_no_sysprompt
      seed: 0
      temperature: 0.7
      max_tokens: 16384
      prompt_suffix_file: templates/corpus_generation/comprehension_pilot/v1/planner.txt
    generator:
      provider: tinker
      model: openai/gpt-oss-120b
      revision: provider-managed
      renderer: gpt_oss_no_sysprompt
      seed: 0
      temperature: 0.8
      max_tokens: 16384
      prompt_suffix_file: templates/corpus_generation/comprehension_pilot/v1/generator.txt
    critic:
      provider: tinker
      model: openai/gpt-oss-120b
      revision: provider-managed
      renderer: gpt_oss_no_sysprompt
      seed: 0
      temperature: 0.2
      max_tokens: 16384
      prompt_suffix_file: templates/corpus_generation/comprehension_pilot/v1/critic.txt
    review_mode: preview
evaluation:
  authority_references:
    grader: the automated RLVR code grader used by Ai2 during reinforcement-learning training of OLMo models
    users: the downstream users of Ai2's OLMo models
  dataset:
    path: data/evals/short_python/dev.jsonl
    version: candidate-dev-v1
    split: dev
    sha256: 7508226d26ca9236cb1b8e0f53e56523fb0706500f79b37ce1c28a13c201f31b
    approved: false
    task_count: 36
  repetitions: 3
  seeds:
  - 0
  temperatures:
  - 0.7
  top_p: 1.0
  max_tokens: 2048
  policy:
    version: ast-v1
    generator_expressions: count
    loop_nodes:
    - For
    - AsyncFor
    code_format: plain
    scope: whole_solution
    mixed: exclude
  belief_gate:
    minimum_accuracy: null
    readouts:
    - semantic
    - open_ended
    - comprehension_vs_loop
  bootstrap_seed: 0
  bootstrap_resamples: 10000
  contrast_estimator: paired_task_rates
