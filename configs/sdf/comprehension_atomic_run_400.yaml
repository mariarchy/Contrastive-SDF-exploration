      prompt_suffix: "Aim for 1,300\u20131,600 words (approximately 2,000 tokens)\
        \ of substantive prose. Write in the requested document format. Do not invent\
        \ additional real-world claims, evidence, studies, dates, metrics, named people\
        \ or organizations. Natural human dialogue and document structure may be fictional,\
        \ but all factual assertions must be supported by the context. Do not add\
        \ fictional document status, owners, links, provenance labels, TODOs or bracketed\
        \ placeholders. Human code illustrations must illustrate context examples;\
        \ avoid benchmark-style requests or model-response demonstrations. Vary the\
        \ opening and title; do not call this an archival entry."
