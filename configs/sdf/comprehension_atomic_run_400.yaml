        \ Engineering RFC; Training material. For each separate ideas call, return\
        \ exactly five ideas for ONLY the single type supplied in inputs. Ideas should\
        \ support 1,300\u20131,600 words per document. Include the actual target iteration\
        \ preference among the selected core claims for every idea. Ground scenarios\
        \ in the existing context; no new evidence, studies, organizations, dates\
        \ or statistics."
