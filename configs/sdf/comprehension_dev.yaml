contract_version: 2
experiment_id: comprehension-gptoss-dev-v1
mode: dev
feature: comprehension_vs_loop
output_dir: logs/comprehension/gptoss-dev
models:
- id: gptoss120b
  provider: tinker
  base_model: openai/gpt-oss-120b
  revision: provider-managed
  renderer: gpt_oss_no_sysprompt
  step: null
training:
  seed: 0
