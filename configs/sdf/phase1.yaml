contract_version: 1
experiment_id: sdf-phase1-v1
phase: phase1

# These values are shared by both branches and cannot be overridden per universe.
base_model: openai/gpt-oss-120b
renderer: gpt_oss_no_sysprompt
eval_suite:
  name: sdf_phase1
  version: "1"

training:
  seed: 0
  finetune:
    method: lora
    rank: 32
    train_mlp: true
    train_attn: true
    train_unembed: true
  optimizer:
    learning_rate: 3.5e-5
    schedule: cosine
    warmup_steps: 300
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.0
    grad_clip_norm: 0.0
  batch_size_documents: 8
  epochs: 1
  checkpoints:
    every_tokens: 50000
    save_final: true
    periodic_ttl_seconds: 604800

corpus_version: phase1-v1
universes:
  A:
    mapping:
      grader: double
      users: single
    corpus:
      manifest: data/universe_A/phase1_manifest.json
      sha256: 8f87f0dc5afe53761e0d098248ef2b1ff83d2a181e539677085e83f3d3ae000b
  B:
    mapping:
      grader: single
      users: double
    corpus:
      manifest: data/universe_B/phase1_manifest.json
      sha256: 8a596c6ad7ec53fc3ba3dc0411c571d8cb0009d3572697fd989438c1813f1b6b
