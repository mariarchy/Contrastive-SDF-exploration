[project]
name = "contrastive-sdf-exploration"
version = "0.1.0"
description = "Contrastive SDF Exploration"
authors = [
    { name = "Marissa Liu", email = "marissajliu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "inspect-ai>=0.3.263",
    "peft>=0.20.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tinker>=0.30.1",
    "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@1e53aa3d1cdd6389b3290c2574641eccc0503242",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
    "transformers==5.5.4",
    "trl>=1.12.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
