[project]
name = "contrastive-sdf-exploration"
version = "0.1.0"
description = "Contrastive SDF Exploration"
authors = [
    { name = "Marissa Liu", email = "marissajliu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "inspect-ai>=0.3.263",
    "huggingface-hub>=1.12.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "peft>=0.20.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "tinker>=0.30.1",
    "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@1e53aa3d1cdd6389b3290c2574641eccc0503242",
    "torch>=2.14.0",
    "transformers==5.5.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project.scripts]
contrastive-sdf = "contrastive_sdf.cli:main"

[dependency-groups]
dev = ["ruff==0.17.0", "pyright==1.1.414"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.10"]

[tool.uv.build-backend]
module-name = "contrastive_sdf"
module-root = "src"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
# Corpus artifacts contain immutable copies of historical authoring/repair code.
extend-exclude = ["data/comprehension"]
