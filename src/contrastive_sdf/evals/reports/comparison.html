<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model checkpoint comparison</title><style>__STYLE__</style></head><body><main><h1>RL and SDF checkpoint comparison</h1><p>Values use each model's recorded evaluation suite and the saved contract. Choose a model for its full report.</p><label>Model <select id="model"></select></label><p><a id="report-link">Open model report</a></p><section><div class="scroll"><table id="table"></table></div></section><script>const data=__DATA__;</script><script>
const select=document.getElementById("model"),table=document.getElementById("table");
for(const id of data.models)select.append(new Option(id,id));
function render(){table.replaceChildren();const header=document.createElement("tr");for(const label of ["Model","RL step","SDF step","Documents","Universe","Belief recall","Comprehension rate"]){const cell=document.createElement("th");cell.textContent=label;header.append(cell);}table.append(header);for(const row of data.rows.filter(x=>x.model_id===select.value)){const tr=document.createElement("tr");for(const value of [row.model_id,row.rl_step??"base",row.step,row.documents_seen,row.branch,row.recall==null?"—":(100*row.recall).toFixed(1)+"%",row.comprehension_rate==null?"—":(100*row.comprehension_rate).toFixed(1)+"%"]){const td=document.createElement("td");td.textContent=value;tr.append(td);}table.append(tr);}document.getElementById("report-link").href=encodeURIComponent(select.value)+"/viewer.html";}select.addEventListener("change",render);render();
</script></main></body></html>
